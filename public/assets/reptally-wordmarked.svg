<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="RepTally wordmark">
  <title>RepTally Wordmark</title>

  <defs>
    <style>
      .r { fill: var(--reptally-red, #c30000); }
      .rest { fill: currentColor; }
      text {
        font-family: Georgia, "Times New Roman", Times, serif;
        font-weight: 700;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Transparent background by default -->
  <text x="40" y="210" font-size="180">
    <tspan class="r">R</tspan><tspan class="rest">epTally</tspan>
  </text>
</svg>